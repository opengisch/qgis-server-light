services:
  worker:
    environment:
      - "QSL_REDIS_URL=redis://redis:6379"
      - "QSL_SVG_PATH=/io/svg"
      - "QSL_DATA_ROOT=/io/data"
      - "QSL_LOG_LEVEL=${QSL_LOG_LEVEL:-info}"
    platform: "${PLATFORM:-linux/amd64}"
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    deploy:
      replicas: ${REPLICAS:-1}
    # prod command is baked into the image
    # overwrite the bash script or just define
    # a new command yourself in the system
    # of your choice: compose, Kubernetes, etc.
    volumes:
      - "${LOCAL_PROJECTS:-./tests/resources/projects}:/io/data"
      - "${LOCAL_SVGS:-./tests/resources/svg}:/io/svg"
    depends_on:
      redis:
        condition: service_healthy
  # same worker image, booted with the state engine and the process runner only,
  # it listens on the process queue so long-running processes never block the map
  # related jobs
  process-worker:
    environment:
      - "QSL_REDIS_URL=redis://redis:6379"
      - "QSL_SVG_PATH=/io/svg"
      - "QSL_DATA_ROOT=/io/data"
      - "QSL_LOG_LEVEL=${QSL_LOG_LEVEL:-info}"
      - "QSL_ENGINE=state"
      - "QSL_RUNNER_PLUGINS=qgis_server_light.worker.runner.process.ProcessRunner"
      - "QSL_PROCESS_OUTPUT_DIR=/io/process_output"
    platform: "${PLATFORM:-linux/amd64}"
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    deploy:
      replicas: ${PROCESS_REPLICAS:-1}
    volumes:
      - "${LOCAL_PROJECTS:-./tests/resources/projects}:/io/data"
      - "${LOCAL_SVGS:-./tests/resources/svg}:/io/svg"
      # the outputs of the processes, it has to be shared with the service
      # handing them out to the clients
      - "process-output:/io/process_output"
    depends_on:
      redis:
        condition: service_healthy
  exporter:
    environment:
      - "QSL_DATA_ROOT=/io/data"
    platform: "${PLATFORM:-linux/amd64}"
    build:
      context: .
      dockerfile: Dockerfile
      target: exporter
    volumes:
      - "${LOCAL_PROJECTS:-./tests/resources/projects}:/io/data"
      - "${LOCAL_SVGS:-./tests/resources/svg}:/io/svg"
    # prod command is baked into the image
    # overwrite the bash script or just define
    # a new command yourself in the system
    # of your choice: compose, Kubernetes, etc.
    ports:
      - "127.0.0.1:5555:5000"
  redis:
    image: redis:8.8.0
    platform: "${PLATFORM:-linux/amd64}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 0.5s
      retries: 50
volumes:
  process-output:
