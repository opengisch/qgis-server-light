[bdist_wheel]
universal = 1

[flake8]
exclude = .cache,.make,.venv,.tox,build,coverage_report,dist,.tox,.eggs,ci/templates,build,dist
max-line-length = 80
ignore = E203

[ruff]
line-length = 88
target-version = py311
exclude = tests/**
select =
    E
    W
    F
    I
    UP
    B
    C4
    SIM
    RET
    ARG
    PTH
    RUF
fix = true
show-fixes = true

[ruff.isort]
force-single-line = true
combine-as-imports = false
order-by-type = true
