name: georama Suite
on:
  # georama-compat.yaml calls the suite once per georama ref
  workflow_call:
    inputs:
      georama-ref:
        description: georama ref the suite runs from, e.g. main or refs/pull/<n>/head
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-georama:
    name: Test georama on these QSL sources
    runs-on: ubuntu-latest
    # builds georama and the QSL dev image (QGIS included), more than the 10 minutes of test.yaml
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # side by side and not nested, so neither checkout ends up in the build context of the other
      - name: Checkout QGIS-Server-Light
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qgis-server-light
      - name: Checkout georama
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengisch/georama
          ref: ${{ inputs.georama-ref }}
          path: georama
      - name: Prepare Build Environment
        working-directory: georama
        # same as the test.yaml of georama, plus the local qsl sources override
        run: |
          cp .env.example .env
          echo "COMPOSE_FILE=compose.yml:compose.dev.yml:compose.dev_with_qsl.yml" >> .env
          echo "LOCAL_QSL_SOURCES=${GITHUB_WORKSPACE}/qgis-server-light" >> .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          cat .env
      - name: Build georama and QGIS-Server-Light Images
        working-directory: georama
        run: |
          docker compose build georama qsl-worker qsl-exporter
      - name: Start Docker composition
        working-directory: georama
        run: docker compose up -d
      - name: Wait for georama to run on these QSL sources
        working-directory: georama
        # the georama entrypoint swaps the locked qsl for these sources after `up -d` returned,
        # its healthcheck (compose.dev_with_qsl.yml) tells when the swap is done
        timeout-minutes: 5
        run: |
          container=$(docker compose ps --quiet georama)
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = "healthy" ]; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = "unhealthy" ]; then
              docker compose logs georama
              exit 1
            fi
            sleep 1
          done
      - name: Run georama tests
        working-directory: georama
        run: docker compose exec georama uv run pytest
