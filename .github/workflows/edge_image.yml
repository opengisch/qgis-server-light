name: Build Edge Images

on:
  # a merged pull request ends in a push to main, so this covers merges too
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-edge
  cancel-in-progress: true

jobs:
  docker-image-edge:
    runs-on: ubuntu-latest
    # manual runs from other branches must not overwrite the edge tags
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - target: worker
            suffix: "-worker"
          - target: exporter
            suffix: "-exporter"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Edge ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          tags: opengisch/qgis-server-light:edge${{ matrix.suffix }}
          # the SBOM (BuildKit scanner, based on syft) is attached to the image as
          # an attestation
          sbom: true
