name: georama Compatibility

on:
  # no paths filter: a required check skipped by a paths filter stays pending forever,
  # a job skipped by its `if` counts as passed
  pull_request:
    # labeled / unlabeled: the impact label is set by hand after the PR is opened
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

permissions:
  contents: read

concurrency:
  group: georama-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # "no impact on georama" is a claim, the green georama main suite is the proof (required check)
  georama-main:
    if: contains(github.event.pull_request.labels.*.name, 'no-georama-impact')
    uses: ./.github/workflows/georama-suite.yaml
    with:
      georama-ref: main

  counterpart:
    if: contains(github.event.pull_request.labels.*.name, 'georama-breaking')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.counterpart.outputs.ref }}
    steps:
      - name: Find counterpart georama PR
        id: counterpart
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
        # the counterpart may be an issue as well, then there is no branch to run
        run: |
          number=$(grep -oE 'opengisch/georama#[0-9]+|github\.com/opengisch/georama/(pull|issues)/[0-9]+' <<< "${BODY}" | head -n 1 | grep -oE '[0-9]+$' || true)
          if [ -z "${number}" ]; then
            echo "::notice::no georama counterpart linked, nothing to run"
            exit 0
          fi
          if ! gh api "repos/opengisch/georama/pulls/${number}" --silent 2>/dev/null; then
            echo "::notice::opengisch/georama#${number} is an issue and not a PR, nothing to run"
            exit 0
          fi
          # refs/pull/<n>/head works for counterparts from forks too
          echo "ref=refs/pull/${number}/head" >> "${GITHUB_OUTPUT}"

  # shows the counterpart works with these sources, it may still be work in progress (informative)
  georama-counterpart:
    needs: counterpart
    if: needs.counterpart.outputs.ref != ''
    uses: ./.github/workflows/georama-suite.yaml
    with:
      georama-ref: ${{ needs.counterpart.outputs.ref }}
