name: CI/CD Pipeline
on:
  push:
    branches:
      - "*"
    tags:
      - v*

jobs:

  gitattributes:
    name: Check style (git-attributes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo rm /etc/apt/sources.list.d/*.list
      - name: Run make git-attributes
        run: make git-attributes

  # TODO: Add linting here when we decided what approach we go for.

  test-py:
    name: Test Python
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - 'ubuntu-24.04'
        qgis-slim-image:
          - 'ghcr.io/opengisch/qgis-slim:3.40'
          - 'ghcr.io/opengisch/qgis-slim:3.44'
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.qgis-slim-image }}
      options: --user 0:0
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update
      - run: apt-get install -y python3-pip python3-setuptools python3-venv make
      - name: Set up test environment
        run: make install-test
      - name: Run tests for Python ${{ matrix.python-version }}
        run: make tests
