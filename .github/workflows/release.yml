name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag is on master
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::${GITHUB_REF_NAME} is not reachable from master, releases are cut from master only"
            exit 1
          fi

  docker-image-release:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        include:
          - target: worker
            suffix: "-worker"
          - target: exporter
            suffix: "-exporter"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Set package version from tag
        # not committed, the version in pyproject.toml stays a placeholder
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Version for image tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          tags: |
            opengisch/qgis-server-light:${{ steps.version.outputs.version }}${{ matrix.suffix }}
            opengisch/qgis-server-light:latest${{ matrix.suffix }}

  github-release:
    runs-on: ubuntu-latest
    needs: docker-image-release
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # notes: PRs merged since the previous tag, grouped by .github/release.yml
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
