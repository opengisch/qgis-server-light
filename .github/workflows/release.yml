name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      final: ${{ steps.final.outputs.final }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not reachable from main, releases are cut from main only"
            exit 1
          fi
      - name: Check tag is a final release
        id: final
        # v26.0 or v26.0.1 move latest, pre-releases like v26.0-beta.1 do not
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "final=true" >> "${GITHUB_OUTPUT}"
          else
            echo "final=false" >> "${GITHUB_OUTPUT}"
          fi


  test:
    needs: check
    uses: ./.github/workflows/test.yaml

  docker-image-release:
    runs-on: ubuntu-latest
    needs: [ check, test ]
    strategy:
      matrix:
        include:
          - target: worker
            suffix: "-worker"
          - target: exporter
            suffix: "-exporter"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set package version from tag
        # not committed, the version in pyproject.toml stays a placeholder
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Version for image tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          tags: |
            opengisch/qgis-server-light:${{ steps.version.outputs.version }}${{ matrix.suffix }}

      # pre-releases (v26.0-beta.1) do not move latest
      - name: Tag Image as latest
        if: needs.check.outputs.final == 'true'
        run: >-
          docker buildx imagetools create
          --tag opengisch/qgis-server-light:latest${{ matrix.suffix }}
          opengisch/qgis-server-light:${{ steps.version.outputs.version }}${{ matrix.suffix }}

  github-release:
    runs-on: ubuntu-latest
    needs: [ check, docker-image-release ]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Write georama compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        # georama reads this before a pin bump, the generated notes don't carry counterparts
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          search=""
          if [ -n "${previous}" ]; then
            search="merged:>$(git log -1 --format=%cI "${previous}")"
          fi
          # shellcheck disable=SC2016 # $counterparts is a jq variable, not a shell one
          breaking=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --base main --label georama-breaking --search "${search}" --limit 100 --json number,title,body --jq '
            .[]
            | ([(.body // "") | scan("(?:opengisch/georama#|github\\.com/opengisch/georama/(?:pull|issues)/)([0-9]+)") | "opengisch/georama#" + .[0]] | unique | join(", ")) as $counterparts
            | "- #\(.number) \(.title) → \(if $counterparts == "" then "no counterpart linked" else "counterpart " + $counterparts end)"')

          # the pin of the latest georama release, georama is public, no token needed beyond the own one
          georama=$(gh release view --repo opengisch/georama --json tagName --jq .tagName 2>/dev/null || true)
          georama_pin=""
          if [ -n "${georama}" ]; then
            georama_pin=$(gh api "repos/opengisch/georama/contents/pyproject.toml?ref=${georama}" -H "Accept: application/vnd.github.raw" | grep -oP 'qgis-server-light\.git@\Kv[^"]+' || true)
          fi

          {
            echo "## georama compatibility"
            echo
            if [ -n "${breaking}" ]; then
              echo "**Breaking for georama.** georama has to change before it can run this release:"
              echo "${breaking}"
              if [ -n "${georama_pin}" ]; then
                echo
                echo "Until a georama release pins ${GITHUB_REF_NAME}, georama ${georama} runs with QSL ${georama_pin}."
              fi
            elif [ -n "${georama_pin}" ]; then
              echo "No breaking change for georama. The pin can be bumped from ${georama_pin} to ${GITHUB_REF_NAME} without changes in georama."
            else
              echo "No breaking change for georama. The pin can be bumped to ${GITHUB_REF_NAME} without changes in georama."
            fi
            echo
          } > georama-compatibility.md
          cat georama-compatibility.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # notes: the georama compatibility first, then the PRs merged since the previous tag, grouped by .github/release.yml
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file georama-compatibility.md --generate-notes --verify-tag --prerelease=${{ needs.check.outputs.final != 'true' }}
