name: Build Docker Images

on:
  push:
    branches:
      - master
  pull_request:


jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: release
            tag: opengisch/qgis-server-light:latest
          - target: dev
            tag: opengisch/qgis-server-light-dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          target: ${{ matrix.target }}
          cache-from: type=local,src=cache
          tags: ${{ matrix.tag }}

      - name: Scan ${{ matrix.target }} with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}
