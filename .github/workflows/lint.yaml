name: Linting/Formatting
on: push
jobs:
  lint-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Build Environment
        run: |
          cp .env.dev.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          cat .env
      - name: Build QGIS-Server-Light Image
        run: |
          docker compose build worker
      - name: Run Ruff
        run: docker compose run --entrypoint bash worker -c "uv run ruff check --output-format=github ."
