services:
  qgis-server-light:
    image: local/opengisch/qgis-server-light-dev:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      - "QSL_REDIS_URL=redis://redis"
      - "QSL_DATA_ROOT=/app/tests/resources"
    volumes:
      - "./:/app"
    deploy:
      replicas: ${QSL_REPLICAS}
  redis:
    image: redis:8.6.2
    ports:
      - "1234:6379"
